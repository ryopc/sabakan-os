# ===========================================================================
# SabakanOS Limine ブートローダー設定 (レーンB 所有)
#
# Linux カーネル (x86_64) をブートするための最小構成。
# 参考: /Users/ryotagtagtag/projects/os/limine.cfg
#
# 前提:
#   - Limine ブートローダ本体 (limine-bios.sys, limine-efi.sys,
#     BOOTIA32.EFI, BOOTX64.EFI) が ISO 内の boot/ にステージングされること
#   - Linux カーネルイメージが boot/kernel に配置されること
#   - initramfs が boot/initramfs.img に配置されること
#   (いずれも scripts/build-iso.sh がステージングを行う)
# ===========================================================================

# 起動メニューを出さず既定エントリを即座に起動する (秒単位)
timeout: 2

# Limine 自身のログもシリアル (COM1) へ出力し、カーネルログと突き合わせられるようにする
serial: yes

# グラフィックスモードを使わずテキストモードを維持する。
# これによりカーネルの VGA テキストバッファ (0xB8000) 出力が画面に現れる。
graphics: no

# ---------------------------------------------------------------------------
# ブートエントリ: SabakanOS Linux x86_64 (既定)
# ---------------------------------------------------------------------------
:SabakanOS (Linux x86_64)
    protocol: linux
    # ISO 内のパス。build-iso.sh のステージング配置に合わせる。
    # boot(): はブートデバイスのルートを指す Limine のパス接頭辞。
    kernel_path: boot():/boot/kernel
    initrd_path: boot():/boot/initramfs.img
    # カーネルへ渡すコマンドライン (早期コンソール設定、ルートは initramfs)
    cmdline: console=ttyS0,115200 earlyprintk=vga root=/dev/ram0 rw

# ---------------------------------------------------------------------------
# ブートエントリ: SabakanOS Linux x86_64 (シリアルコンソール専用)
# ---------------------------------------------------------------------------
:SabakanOS (Serial console only)
    protocol: linux
    kernel_path: boot():/boot/kernel
    initrd_path: boot():/boot/initramfs.img
    cmdline: console=ttyS0,115200 earlyprintk=vga root=/dev/ram0 rw

# ---------------------------------------------------------------------------
# 備考: Limine 独自プロトコル (protocol: limine) を使うカーネルの場合は
# 以下のように initrd_path を省略し kernel_path だけ指定する。
#
# :SabakanOS (Limine protocol)
#     protocol: limine
#     kernel_path: boot():/boot/kernel.elf
#     cmdline: console=ttyS0,115200 earlyprintk=vga
# ---------------------------------------------------------------------------
