name: CI

# push / pull request でドキュメント・ライセンス・ビルドを検証する。
# release.yml から workflow_call で再利用される。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LC_ALL: C.UTF-8

defaults:
  run:
    shell: bash

jobs:
  docs:
    name: ドキュメント検証
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 必須ファイルの存在確認
        run: |
          set -euo pipefail
          status=0
          for f in \
            README.md \
            LICENSE \
            docs/requirements.md \
            docs/license.md \
            docs/source-flow.md \
            docs/source-manifest.example.tsv \
            iso/COPYING \
            .github/workflows/ci.yml \
            .github/workflows/release.yml; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::必須ファイルが存在しないか、内容が空です"
              status=1
            fi
          done
          exit "$status"

      - name: README の記載項目を確認
        run: |
          set -euo pipefail
          status=0
          check() {
            if ! grep -q -- "$1" README.md; then
              echo "::error file=README.md::「$1」に関する記載がありません"
              status=1
            fi
          }
          check "make build-kernel"
          check "make build-rootfs"
          check "## Installation"
          check "## Japanese Environment Setup"
          check "## Directory Layout"
          check "## License"
          check "MIT License"
          check "GPL-2.0-only"
          exit "$status"

      - name: Markdown の相対リンクを検証
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          errors = []

          for md in pathlib.Path(".").rglob("*.md"):
              if ".git" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  target = target.strip().strip("<>")
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  path = target.split("#", 1)[0]
                  if not path:
                      continue
                  if not (md.parent / path).resolve().exists():
                      errors.append(f"{md}: リンク切れ -> {target}")

          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

  license:
    name: ライセンス検証
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: iso/COPYING の記載確認
        run: |
          set -euo pipefail
          status=0
          for name in \
            "Linux kernel" \
            "BusyBox" \
            "Limine" \
            "OpenRC" \
            "apk-tools" \
            "GPL-2.0" \
            "BSD-2-Clause" \
            "SIL OFL 1.1" \
            "Obtaining the Corresponding Source Code" \
            "MIT License"; do
            if ! grep -q -- "$name" iso/COPYING; then
              echo "::error file=iso/COPYING::「$name」の記載がありません"
              status=1
            fi
          done
          if ! grep -q -- "/usr/share/licenses/" iso/COPYING; then
            echo "::error file=iso/COPYING::ライセンス全文の配置先が記載されていません"
            status=1
          fi
          exit "$status"

      - name: ライセンス方針ドキュメントの確認
        run: |
          set -euo pipefail
          status=0
          for f in docs/license.md docs/source-flow.md; do
            for keyword in GPL-2.0 LGPL Written; do
              if ! grep -q -- "$keyword" "$f"; then
                echo "::error file=$f::「$keyword」に関する記載がありません"
                status=1
              fi
            done
          done
          exit "$status"

      - name: ソースマニフェストの書式確認
        run: |
          set -euo pipefail
          manifest=docs/source-manifest.example.tsv
          if [ ! -s "$manifest" ]; then
            echo "::error::マニフェストのテンプレートがありません"
            exit 1
          fi
          awk -F'\t' '
            /^#/ { next }
            {
              if (NF != 9) {
                printf "::error file=%s::ヘッダの列数が 9 ではありません（%d 列）\n", FILENAME, NF
                exit 1
              }
              if ($1 != "component" || $2 != "version" || $3 != "license" || $8 != "in_iso" || $9 != "notes") {
                printf "::error file=%s::ヘッダの列名が仕様と一致しません\n", FILENAME
                exit 1
              }
              exit 0
            }
          ' "$manifest"

      - name: 秘密情報の混入チェック
        run: |
          set -euo pipefail
          status=0
          patterns='AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -n -E -I "$patterns" -- . ':!*.md' ':!.github/workflows'; then
            echo "::error::秘密情報の可能性がある文字列を検出しました"
            status=1
          fi
          while IFS= read -r f; do
            case "$f" in
              *.example|*.sample|*.md) continue ;;
            esac
            echo "::error file=$f::秘密情報ファイルが追跡されています"
            status=1
          done < <(git ls-files '*.pem' '*.key' '.env' '*.p12' '*.keystore' || true)
          exit "$status"

  build_kernel:
    name: カーネルビルド (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: ビルドキャッシュを復元 (カーネル)
        uses: actions/cache/restore@v4
        with:
          path: |
            build/linux-6.12.34/
            build/sources/
          key: sabakanos-kernel-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('config/kernel-defconfig-common', 'config/kernel-defconfig-x86_64', 'config/kernel-defconfig-arm64') }}
          restore-keys: |
            sabakanos-kernel-${{ runner.os }}-${{ matrix.arch }}-

      - name: Makefile の存在確認
        run: |
          if [ ! -f Makefile ]; then
            echo "::error::Makefile が見つかりません。実装レーンのビルド基盤が必要です（docs/requirements.md 第 6 章）"
            exit 1
          fi

      - name: ビルド依存の導入
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev dwarves \
            cpio kmod rsync curl wget xz-utils git make zstd \
            clang llvm lld \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: ビルド環境の情報
        run: |
          nproc
          free -m
          df -h .

      - name: カーネルをビルド
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ARCH=arm64 make build-kernel CROSS_COMPILE=aarch64-linux-gnu-
          else
            make build-kernel
          fi

      - name: 成果物の確認
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            images=(build/linux-*/arch/arm64/boot/Image)
          else
            images=(build/linux-*/arch/x86/boot/bzImage)
          fi
          configs=(build/linux-*/.config)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::カーネルイメージが生成されていません（${{ matrix.arch }}）"
            ls -la build 2>/dev/null || true
            exit 1
          fi
          if [ "${#configs[@]}" -eq 0 ]; then
            echo "::error::.config が生成されていません"
            exit 1
          fi
          ls -lh "${images[@]}" "${configs[@]}"

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: |
            build/linux-*/arch/${{ matrix.arch }}/boot/*
            build/linux-*/.config
          if-no-files-found: error
          retention-days: 7

      - name: ビルドキャッシュを保存 (カーネル)
        uses: actions/cache/save@v4
        with:
          path: |
            build/linux-6.12.34/
            build/sources/
          key: sabakanos-kernel-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('config/kernel-defconfig-common', 'config/kernel-defconfig-x86_64', 'config/kernel-defconfig-arm64') }}

  build_rootfs:
    name: ルートFSビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: ビルドキャッシュを復元 (ルートFS)
        uses: actions/cache/restore@v4
        with:
          path: |
            build/buildroot/
            build/sources/
          key: sabakanos-rootfs-${{ runner.os }}-${{ hashFiles('config/buildroot-defconfig') }}
          restore-keys: |
            sabakanos-rootfs-${{ runner.os }}-

      - name: Makefile の存在確認
        run: |
          if [ ! -f Makefile ]; then
            echo "::error::Makefile が見つかりません。実装レーンのビルド基盤が必要です（docs/requirements.md 第 6 章）"
            exit 1
          fi

      - name: ビルド依存の導入
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential rsync curl wget xz-utils git make zstd \
            fakeroot squashfs-tools cpio kmod bc busybox

      - name: ルートFSをビルド
        run: make build-rootfs

      - name: 成果物の確認
        run: |
          set -euo pipefail
          du -sh rootfs
          for f in rootfs/init rootfs/etc/passwd rootfs/etc/hostname; do
            if [ ! -e "$f" ]; then
              echo "::error::$f が存在しません"
              exit 1
            fi
          done
          if [ ! -L rootfs/bin/sh ] && [ ! -e rootfs/bin/sh ]; then
            echo "::error::rootfs/bin/sh が存在しません"
            exit 1
          fi
          ls -la rootfs/bin/sh

      - name: ルートFSをアーカイブ
        run: sudo tar -C rootfs -cf rootfs.tar .

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-build
          path: rootfs.tar
          if-no-files-found: error
          retention-days: 7

      - name: ビルドキャッシュを保存 (ルートFS)
        uses: actions/cache/save@v4
        with:
          path: |
            build/buildroot/
            build/sources/
          key: sabakanos-rootfs-${{ runner.os }}-${{ hashFiles('config/buildroot-defconfig') }}

  build_iso:
    name: ISO ビルド（${{ matrix.arch }}）（参考）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - build_rootfs
      - build_kernel
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: ビルド依存の導入
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev dwarves \
            cpio kmod rsync curl wget xz-utils git make zstd \
            xorriso mtools dosfstools \
            gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu nasm perl \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: カーネル成果物を取得
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ matrix.arch }}
          path: build

      - name: ルートFS成果物を取得
        uses: actions/download-artifact@v4
        with:
          name: rootfs-build
          path: .

      - name: ルートFSを展開
        run: |
          set -euo pipefail
          mkdir -p rootfs
          sudo tar -C rootfs -xf rootfs.tar
          rm -f rootfs.tar

      - name: カーネルを ISO 生成スクリプトの候補パスへ配置
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            image=$(find build -type f -name Image -print -quit)
            if [ -z "$image" ]; then
              echo "::error::arm64 カーネルイメージ (Image) が見つかりません"
              find build -maxdepth 3 -type f | head -n 20 || true
              exit 1
            fi
          else
            image=$(find build -type f -name bzImage -print -quit)
            if [ -z "$image" ]; then
              echo "::error::bzImage が見つかりません"
              find build -maxdepth 3 -type f | head -n 20 || true
              exit 1
            fi
          fi
          # build-iso.sh は $BUILD_DIR/kernel をファイル（-f）として探すため、
          # ディレクトリではなくファイルとして直接コピーする
          cp "$image" build/kernel
          ls -lh build/kernel

      - name: initramfs を生成
        run: |
          set -euo pipefail
          cd rootfs && find . | cpio -o -H newc | gzip > ../build/initramfs.img
          ls -lh ../build/initramfs.img

      - name: Limine をソースからビルド
        run: |
          set -euo pipefail
          mkdir -p build/limine
          cd build/limine
          LIMINE_VER="12.9.6"
          curl -fsSL -o limine.tar.xz "https://github.com/limine-bootloader/limine/releases/download/v${LIMINE_VER}/limine-${LIMINE_VER}.tar.xz"
          tar -xf limine.tar.xz
          cd "limine-${LIMINE_VER}"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./configure --host=aarch64-linux-gnu \
              --enable-uefi-aarch64 \
              CC=aarch64-linux-gnu-gcc \
              CC_FOR_TARGET=aarch64-linux-gnu-gcc \
              LD_FOR_TARGET=aarch64-linux-gnu-ld \
              OBJCOPY_FOR_TARGET=aarch64-linux-gnu-objcopy \
              OBJDUMP_FOR_TARGET=aarch64-linux-gnu-objdump \
              STRIP=aarch64-linux-gnu-strip \
              READELF_FOR_TARGET=aarch64-linux-gnu-readelf \
              NM_FOR_TARGET=aarch64-linux-gnu-nm
          else
            ./configure --host=x86_64-unknown-linux-gnu \
              --enable-bios --enable-bios-cd --enable-bios-pxe \
              --enable-uefi-x86-64 \
              CC=x86_64-linux-gnu-gcc \
              CC_FOR_TARGET=x86_64-linux-gnu-gcc \
              LD_FOR_TARGET=x86_64-linux-gnu-ld \
              OBJCOPY_FOR_TARGET=x86_64-linux-gnu-objcopy \
              OBJDUMP_FOR_TARGET=x86_64-linux-gnu-objdump \
              STRIP=x86_64-linux-gnu-strip \
              READELF_FOR_TARGET=x86_64-linux-gnu-readelf \
              NM_FOR_TARGET=x86_64-linux-gnu-nm
          fi
          make
          # Limine BIOS ブートイメージを探してコピー（場所はバージョンにより異なるため）
          # limine-bios.sys (2 段目ペイロード) と limine-bios-cd.bin (El Torito ブートイメージ)
          # は別々のファイルなので、それぞれ独立してコピーする。
          BIOS_SYS=$(find . -name "limine-bios.sys" 2>/dev/null | head -1)
          BIOS_CD=$(find . -name "limine-bios-cd.bin" 2>/dev/null | head -1)
          if [ -n "$BIOS_SYS" ]; then
            cp "$BIOS_SYS" ../limine-bios.sys
          fi
          if [ -n "$BIOS_CD" ]; then
            cp "$BIOS_CD" ../limine-bios-cd.bin
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            if [ -f common-uefi-aarch64/BOOTAA64.EFI ]; then
              cp common-uefi-aarch64/BOOTAA64.EFI ../limine-uefi-cd.bin
              cp common-uefi-aarch64/BOOTAA64.EFI ../limine-efi.sys
            fi
          else
            if [ -f common-uefi-x86-64/BOOTX64.EFI ]; then
              cp common-uefi-x86-64/BOOTX64.EFI ../limine-uefi-cd.bin
              cp common-uefi-x86-64/BOOTX64.EFI ../limine-efi.sys
            fi
          fi
          ls -la ../limine-bios-cd.bin ../limine-bios.sys ../limine-uefi-cd.bin ../limine-efi.sys 2>&1 || true
          cd ../..
          ls -la limine/

      - name: ISO をビルド
        run: ARCH=${{ matrix.arch }} ./scripts/build-iso.sh

      - name: ISO の確認
        run: |
          set -euo pipefail
          if [ ! -s build/sabakanos.iso ]; then
            echo "::error::ISO が生成されていません（${{ matrix.arch }}）"
            exit 1
          fi
          ls -lh build/sabakanos.iso
          sha256sum build/sabakanos.iso | tee build/SHA256SUMS
          if [ ! -s iso/COPYING ]; then
            echo "::error::iso/COPYING がありません。ライセンス一覧を同梱してください"
            exit 1
          fi

      - name: ISO をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: iso-image-${{ matrix.arch }}
          path: |
            build/sabakanos.iso
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  boot_test:
    name: ブートテスト (QEMU x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - build_kernel
      - build_rootfs
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: QEMU の導入
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: カーネル成果物を取得
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-x86_64
          path: build

      - name: ルートFS成果物を取得
        uses: actions/download-artifact@v4
        with:
          name: rootfs-build
          path: .

      - name: カーネルと initramfs を配置
        run: |
          set -euo pipefail
          image=$(find build -type f -name bzImage -print -quit)
          if [ -z "$image" ]; then
            echo "::error::bzImage が見つかりません"
            find build -maxdepth 3 -type f | head -n 20 || true
            exit 1
          fi
          cp "$image" build/kernel-x86_64
          ls -lh build/kernel-x86_64

          mkdir -p rootfs
          sudo tar -C rootfs -xf rootfs.tar
          rm -f rootfs.tar
          cd rootfs && find . | cpio -o -H newc | gzip > ../build/initramfs.img
          cd ..
          ls -lh build/initramfs.img

      - name: ブートテストを実行
        run: |
          chmod +x scripts/run-qemu.sh
          QEMU_TIMEOUT=60 ./scripts/run-qemu.sh

  ci-summary:
    name: 検証サマリ
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - docs
      - license
      - build_kernel
      - build_rootfs
      - build_iso
      - boot_test
    if: always()
    steps:
      - name: 結果をまとめる
        run: |
          set -uo pipefail
          echo "docs          : ${{ needs.docs.result }}"
          echo "license       : ${{ needs.license.result }}"
          echo "build_kernel  : ${{ needs.build_kernel.result }}"
          echo "build_rootfs  : ${{ needs.build_rootfs.result }}"
          echo "build_iso     : ${{ needs.build_iso.result }}（参考）"

          status=0
          for pair in \
            "docs:${{ needs.docs.result }}" \
            "license:${{ needs.license.result }}" \
            "build_kernel:${{ needs.build_kernel.result }}" \
            "build_rootfs:${{ needs.build_rootfs.result }}" \
            "build_iso:${{ needs.build_iso.result }}" \
            "boot_test:${{ needs.boot_test.result }}"; do
            name=${pair%%:*}
            result=${pair##*:}
            if [ "$result" != "success" ]; then
              echo "::error::$name ジョブが失敗しました（$result）"
              status=1
            fi
          done

          exit "$status"
